<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" fill="#f97316" font-size="20" font-weight="700">Thread、ThreadLocalMap 与 ThreadLocal 的关系</text>

  <rect x="360" y="64" width="280" height="46" rx="10" fill="#fff1e6" stroke="#f97316"/>
  <text x="500" y="93" text-anchor="middle" fill="#242529" font-size="14" font-weight="700">类的静态字段：ThreadLocal（强引用）</text>

  <g font-size="13" fill="#242529">
    <rect x="40" y="140" width="420" height="250" rx="14" fill="#f7f7f8" stroke="#ececef"/>
    <text x="250" y="172" text-anchor="middle" font-size="15" font-weight="700">Thread A</text>
    <rect x="80" y="190" width="340" height="42" rx="8" fill="#ffffff" stroke="#ececef"/>
    <text x="250" y="216" text-anchor="middle">threadLocals : ThreadLocalMap</text>
    <rect x="110" y="250" width="280" height="110" rx="8" fill="#ffffff" stroke="#ececef"/>
    <text x="250" y="276" text-anchor="middle" fill="#8a8d94" font-size="12">Entry</text>
    <text x="250" y="300" text-anchor="middle">Key → ThreadLocal（弱引用）</text>
    <text x="250" y="330" text-anchor="middle" fill="#f97316" font-weight="700">Value → 用户A（强引用）</text>

    <rect x="540" y="140" width="420" height="250" rx="14" fill="#f7f7f8" stroke="#ececef"/>
    <text x="750" y="172" text-anchor="middle" font-size="15" font-weight="700">Thread B</text>
    <rect x="580" y="190" width="340" height="42" rx="8" fill="#ffffff" stroke="#ececef"/>
    <text x="750" y="216" text-anchor="middle">threadLocals : ThreadLocalMap</text>
    <rect x="610" y="250" width="280" height="110" rx="8" fill="#ffffff" stroke="#ececef"/>
    <text x="750" y="276" text-anchor="middle" fill="#8a8d94" font-size="12">Entry</text>
    <text x="750" y="300" text-anchor="middle">Key → ThreadLocal（弱引用）</text>
    <text x="750" y="330" text-anchor="middle" fill="#f97316" font-weight="700">Value → 用户B（强引用）</text>
  </g>

  <g stroke="#5b6678" stroke-width="2" fill="none">
    <line x1="500" y1="110" x2="500" y2="132"/>
    <line x1="500" y1="132" x2="250" y2="132"/>
    <line x1="250" y1="132" x2="250" y2="188"/>
    <line x1="500" y1="132" x2="750" y2="132"/>
    <line x1="750" y1="132" x2="750" y2="188"/>
  </g>
  <text x="500" y="126" text-anchor="middle" fill="#8a8d94" font-size="11">同一个 Key 被不同线程共用</text>

  <text x="500" y="428" text-anchor="middle" fill="#8a8d94" font-size="12">remove() 只清理「当前线程」ThreadLocalMap 中对应 Entry；线程池复用线程时 Value 可能长期滞留</text>
</svg>
