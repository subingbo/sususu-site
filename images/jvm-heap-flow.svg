<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="340" viewBox="0 0 1060 340" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1060" height="340" fill="#0f1115"/>
  <text x="530" y="46" text-anchor="middle" fill="#ffb37a" font-size="22" font-weight="700">JVM 堆快照 → MAT 排查链路</text>
  <g font-size="15" fill="#e8eaee">
    <rect x="30" y="120" width="170" height="86" rx="14" fill="#1c2230" stroke="#3a4557"/>
    <text x="115" y="153" text-anchor="middle">正在运行的 Java 进程</text>
    <text x="115" y="178" text-anchor="middle" fill="#9aa3b2" font-size="12">内存异常 / OOM</text>

    <rect x="240" y="120" width="190" height="86" rx="14" fill="#1c2230" stroke="#3a4557"/>
    <text x="335" y="150" text-anchor="middle">jcmd GC.heap_dump</text>
    <text x="335" y="174" text-anchor="middle" fill="#9aa3b2" font-size="12">或 OOM 自动导出</text>

    <rect x="470" y="120" width="150" height="86" rx="14" fill="#1c2230" stroke="#f97316"/>
    <text x="545" y="153" text-anchor="middle" fill="#ffb37a">heap.hprof</text>
    <text x="545" y="178" text-anchor="middle" fill="#9aa3b2" font-size="12">某一时刻的堆</text>

    <rect x="660" y="120" width="150" height="86" rx="14" fill="#1c2230" stroke="#3a4557"/>
    <text x="735" y="153" text-anchor="middle">Eclipse MAT</text>
    <text x="735" y="178" text-anchor="middle" fill="#9aa3b2" font-size="12">解析对象引用图</text>

    <rect x="850" y="120" width="180" height="86" rx="14" fill="#1c2230" stroke="#3a4557"/>
    <text x="940" y="150" text-anchor="middle">定位源码并修复</text>
    <text x="940" y="174" text-anchor="middle" fill="#9aa3b2" font-size="12">同负载复测验证</text>
  </g>
  <g stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="200" y1="163" x2="238" y2="163"/>
    <line x1="430" y1="163" x2="468" y2="163"/>
    <line x1="620" y1="163" x2="658" y2="163"/>
    <line x1="810" y1="163" x2="848" y2="163"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f97316"/>
    </marker>
  </defs>
  <g font-size="13" fill="#9aa3b2">
    <text x="30" y="250">堆快照能回答：对象有多少、谁持有、为什么没被回收；</text>
    <text x="30" y="274">不能直接回答：哪一行源码分配了它、是否“持续增长”（需结合 GC 曲线）。</text>
  </g>
</svg>
